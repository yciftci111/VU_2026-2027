<!doctype html>
<html lang="nl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Keuzevrijheid onder maatschappelijke druk – enquête</title>
<meta name="description" content="Anonieme enquête over maatschappelijke druk, ervaren discriminatie, religieuze identiteit en keuzevrijheid rond het dragen van een hoofddoek.">
<meta name="robots" content="noindex">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&family=Source+Serif+4:opsz,wght@8..60,600&display=swap" rel="stylesheet">
<link rel="stylesheet" href="style.css">
</head>
<body>
<div class="topbar">
  <div class="inner"><div class="brand">Keuzevrijheid onder maatschappelijke druk</div><div id="stepLabel" class="small muted"></div></div>
  <div class="progress" aria-hidden="true"><div id="bar"></div></div>
</div>

<main class="wrap">
  <div id="configWarn" class="notice error" style="display:none;margin-bottom:16px">
    Testmodus: er is nog geen Apps Script-URL ingesteld in <code>config.js</code>. Antwoorden worden níet opgeslagen.
  </div>
  <form id="app" novalidate autocomplete="off"></form>
</main>

<footer class="foot">
  <span>Postacademische Islamitische Ambtsopleiding</span>
  <a href="resultaten.html">Onderzoeker</a>
</footer>

<script src="config.js"></script>
<script src="questions.js"></script>
<script>
(function () {
  const app = document.getElementById('app');
  const bar = document.getElementById('bar');
  const stepLabel = document.getElementById('stepLabel');
  const configured = /^https:\/\/script\.google\.com\//.test(CONFIG.APPS_SCRIPT_URL);
  if (!configured) document.getElementById('configWarn').style.display = 'block';

  const answers = {};           // key -> waarde
  const startedAt = Date.now();
  let view = 'intro';           // 'intro' | page index | 'stop' | 'interview' | 'done'
  let busy = false;

  const esc = s => String(s).replace(/[&<>"']/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
  const P = SURVEY.pages;

  // ── Rendering ─────────────────────────────────────────────
  function renderQuestion(q) {
    const id = 'q_' + q.key;
    const req = q.required ? '<span class="req" aria-hidden="true">*</span>' : '';
    const num = q.n ? `<span class="num">${esc(q.n)}.</span>` : '';
    const help = q.help ? `<div class="q-help">${esc(q.help)}</div>` : '';
    let body = '';
    const val = answers[q.key];

    if (q.type === 'radio' || q.type === 'likert' || q.type === 'checkbox') {
      const t = q.type === 'checkbox' ? 'checkbox' : 'radio';
      const cls = q.type === 'likert' ? 'options likert' : 'options';
      body = `<div class="${cls}" style="--n:${q.options.length}" role="${t === 'radio' ? 'radiogroup' : 'group'}" aria-labelledby="${id}_l">` +
        q.options.map((o, i) => {
          const v = q.type === 'likert' ? String(i + 1) : o;
          const checked = t === 'checkbox' ? (Array.isArray(val) && val.includes(o)) : String(val) === v;
          return `<label class="opt"><input type="${t}" name="${q.key}" value="${esc(v)}" ${checked ? 'checked' : ''}><span>${esc(o)}</span></label>`;
        }).join('') + '</div>';
      if (q.other) {
        const show = t === 'checkbox' ? (Array.isArray(val) && val.includes(q.other)) : val === q.other;
        body += `<input type="text" class="other-input" name="${q.key}_anders" placeholder="Namelijk…" maxlength="200" value="${esc(answers[q.key + '_anders'] || '')}" style="display:${show ? 'block' : 'none'}" aria-label="Anders, namelijk">`;
      }
    } else if (q.type === 'scale') {
      body = `<div class="scale" role="radiogroup" aria-labelledby="${id}_l">` +
        Array.from({ length: q.max - q.min + 1 }, (_, i) => q.min + i).map(v =>
          `<label><input type="radio" name="${q.key}" value="${v}" ${String(val) === String(v) ? 'checked' : ''}>${v}</label>`).join('') +
        `</div><div class="scale-ends"><span>${esc(q.minLabel)}</span><span>${esc(q.maxLabel)}</span></div>`;
    } else if (q.type === 'textarea') {
      body = `<textarea id="${id}" name="${q.key}" maxlength="4000" aria-labelledby="${id}_l">${esc(val || '')}</textarea>`;
    } else {
      const extra = q.type === 'number' ? `inputmode="numeric" min="${q.min}" max="${q.max}" step="1" style="max-width:160px"` : '';
      const ac = q.autocomplete ? `autocomplete="${q.autocomplete}"` : '';
      body = `<input id="${id}" type="${q.type}" name="${q.key}" ${extra} ${ac} maxlength="200" value="${esc(val ?? '')}" aria-labelledby="${id}_l">`;
    }
    return `<div class="card q" data-key="${q.key}">
      <span class="q-label" id="${id}_l">${num}${esc(q.label)}${req}</span>${help}${body}
      <div class="err" role="alert">${q.type === 'email' ? 'Vul een geldig e-mailadres in.' : q.type === 'number' ? `Vul een leeftijd in tussen ${q.min} en ${q.max}.` : 'Deze vraag is verplicht.'}</div>
    </div>`;
  }

  function setProgress(frac, label) {
    bar.style.width = Math.round(frac * 100) + '%';
    stepLabel.textContent = label || '';
  }

  function render() {
    window.scrollTo(0, 0);
    if (view === 'intro') {
      setProgress(0, '');
      app.innerHTML = `<div class="card">
        <div class="eyebrow">Introductie</div>
        <h1>${esc(SURVEY.title)}</h1>
        ${SURVEY.intro.map(p => `<p>${esc(p)}</p>`).join('')}
        <div class="nav" style="justify-content:flex-end"><button type="button" class="btn primary" data-go="next">Start de vragenlijst</button></div>
      </div>`;
    } else if (typeof view === 'number') {
      const p = P[view];
      setProgress(view / P.length, `Stap ${view + 1} van ${P.length}`);
      app.innerHTML = `<div class="section-head"><div class="eyebrow">Onderdeel ${view + 1} van ${P.length}</div><h2>${esc(p.title)}</h2>${p.text ? `<p>${esc(p.text)}</p>` : ''}</div>
        ${p.questions.map(renderQuestion).join('')}
        <div id="formErr" class="notice error" style="display:none" role="alert"></div>
        <div class="nav">
          <button type="button" class="btn" data-go="back">Terug</button>
          <button type="button" class="btn primary" data-go="next">${view === P.length - 1 ? 'Verzenden' : 'Volgende'}</button>
        </div>`;
    } else if (view === 'stop') {
      setProgress(1, '');
      const minor = answers.volwassen === 'Nee';
      app.innerHTML = `<div class="card center">
        <h2>Bedankt voor je interesse</h2>
        <p>${minor ? 'Dit onderzoek is alleen bedoeld voor deelnemers van 18 jaar en ouder.' : 'Je hebt aangegeven geen toestemming te geven.'} Daarom eindigt de vragenlijst hier. Er zijn geen antwoorden opgeslagen.</p>
        <button type="button" class="btn" data-go="back">Toch terug naar de vorige vraag</button>
      </div>`;
    } else if (view === 'interview') {
      const iv = SURVEY.interview;
      setProgress(1, 'Interview');
      app.innerHTML = `<div class="section-head"><div class="eyebrow">Je enquête is verzonden ✓</div><h2>${esc(iv.title)}</h2>${iv.text.map(t => `<p>${esc(t)}</p>`).join('')}</div>
        ${iv.questions.map(renderQuestion).join('')}
        <div class="hp" aria-hidden="true"><label>Website<input type="text" name="website" tabindex="-1" autocomplete="off"></label></div>
        <div id="formErr" class="notice error" style="display:none" role="alert"></div>
        <div class="nav">
          <button type="button" class="btn" data-go="skip">Toch niet aanmelden</button>
          <button type="button" class="btn primary" data-go="interview">Aanmelden</button>
        </div>`;
    } else if (view === 'done' || view === 'done-interview') {
      setProgress(1, 'Afgerond');
      app.innerHTML = `<div class="card center">
        <div class="done-icon" aria-hidden="true"><svg width="28" height="28" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><path d="M5 12.5l4.5 4.5L19 7.5"/></svg></div>
        <h2>Hartelijk dank voor je deelname!</h2>
        <p>${view === 'done-interview'
          ? 'Je aanmelding voor het online interview is ontvangen. Ik neem binnenkort per e-mail contact met je op om een moment in te plannen.'
          : 'Je antwoorden zijn opgeslagen. De vragenlijst is hiermee afgerond; je kunt dit venster sluiten.'}</p>
        ${CONFIG.CONTACT_EMAIL ? `<p class="small muted">Vragen over het onderzoek? Mail naar <a href="mailto:${esc(CONFIG.CONTACT_EMAIL)}">${esc(CONFIG.CONTACT_EMAIL)}</a>.</p>` : ''}
      </div>`;
    }
  }

  // ── Antwoorden lezen & valideren ──────────────────────────
  function collect(questions) {
    questions.forEach(q => {
      if (q.type === 'checkbox') {
        answers[q.key] = [...app.querySelectorAll(`input[name="${q.key}"]:checked`)].map(i => i.value);
      } else if (['radio', 'likert', 'scale'].includes(q.type)) {
        const c = app.querySelector(`input[name="${q.key}"]:checked`);
        answers[q.key] = c ? (q.type === 'radio' ? c.value : Number(c.value)) : undefined;
      } else {
        const el = app.querySelector(`[name="${q.key}"]`);
        answers[q.key] = el ? el.value.trim() : '';
        if (q.type === 'number' && answers[q.key] !== '') answers[q.key] = Number(answers[q.key]);
      }
      if (q.other) {
        const o = app.querySelector(`[name="${q.key}_anders"]`);
        answers[q.key + '_anders'] = o && o.style.display !== 'none' ? o.value.trim() : '';
      }
    });
  }

  function validate(questions) {
    let first = null;
    questions.forEach(q => {
      const v = answers[q.key];
      let ok = true;
      if (q.required) ok = !(v === undefined || v === '' || (Array.isArray(v) && !v.length));
      if (ok && q.type === 'number' && v !== '') ok = Number.isInteger(v) && v >= q.min && v <= q.max;
      if (ok && q.type === 'email') ok = /^[^\s@]+@[^\s@]+\.[^\s@]+$/.test(v);
      const card = app.querySelector(`.q[data-key="${q.key}"]`);
      card.classList.toggle('invalid', !ok);
      if (!ok && !first) first = card;
    });
    if (first) { first.scrollIntoView({ behavior: 'smooth', block: 'center' }); return false; }
    return true;
  }

  // ── Versturen ─────────────────────────────────────────────
  async function post(action, data) {
    if (!configured) { await new Promise(r => setTimeout(r, 400)); console.info('[testmodus]', action, data); return { ok: true }; }
    const res = await fetch(CONFIG.APPS_SCRIPT_URL, { method: 'POST', body: JSON.stringify({ action, data, website: data.website || '' }) });
    return res.json();
  }

  function surveyPayload() {
    const out = {};
    P.forEach(p => p.questions.forEach(q => {
      const v = answers[q.key];
      out[q.key] = Array.isArray(v) ? v.join('; ') : (v ?? '');
      if (q.other) out[q.key + '_anders'] = answers[q.key + '_anders'] || '';
    }));
    out.duur_sec = Math.round((Date.now() - startedAt) / 1000);
    return out;
  }

  async function withBusy(btn, fn) {
    if (busy) return; busy = true;
    const label = btn.textContent; btn.disabled = true; btn.textContent = 'Bezig met verzenden…';
    const err = document.getElementById('formErr'); if (err) err.style.display = 'none';
    try { await fn(); }
    catch (e) {
      if (err) { err.textContent = 'Verzenden is niet gelukt. Controleer je internetverbinding en probeer het opnieuw.'; err.style.display = 'block'; }
      console.error(e);
    } finally { busy = false; if (document.body.contains(btn)) { btn.disabled = false; btn.textContent = label; } }
  }

  // ── Navigatie ─────────────────────────────────────────────
  app.addEventListener('click', async e => {
    const btn = e.target.closest('[data-go]'); if (!btn) return;
    const go = btn.dataset.go;

    if (go === 'back') {
      if (typeof view === 'number') collect(P[view].questions);
      view = view === 'stop' ? 0 : (view === 0 ? 'intro' : view - 1);
      return render();
    }
    if (go === 'skip') { view = 'done'; return render(); }

    if (go === 'interview') {
      const qs = SURVEY.interview.questions; collect(qs);
      if (!validate(qs)) return;
      const hp = app.querySelector('[name="website"]');
      return withBusy(btn, async () => {
        const r = await post('interview', { naam: answers.naam, email: answers.email, opmerking: answers.opmerking, website: hp ? hp.value : '' });
        if (!r.ok) throw new Error(r.error);
        view = 'done-interview'; render();
      });
    }

    // next
    if (view === 'intro') { view = 0; return render(); }
    const p = P[view]; collect(p.questions);
    if (!validate(p.questions)) return;
    if (view === 0 && (answers.volwassen === 'Nee' || answers.toestemming !== 'Ja, ik geef toestemming')) { view = 'stop'; return render(); }
    if (view < P.length - 1) { view++; return render(); }

    // laatste pagina → enquête opslaan, daarna evt. interviewpagina
    return withBusy(btn, async () => {
      const r = await post('survey', surveyPayload());
      if (!r.ok) throw new Error(r.error);
      view = answers.interview === 'Ja, ik ben bereid om deel te nemen' ? 'interview' : 'done';
      render();
    });
  });

  // "Anders, namelijk" tonen/verbergen + foutmelding wissen bij invullen
  app.addEventListener('change', e => {
    const card = e.target.closest('.q'); if (!card) return;
    card.classList.remove('invalid');
    const key = card.dataset.key;
    const other = card.querySelector('.other-input');
    if (other) {
      const q = [...P.flatMap(p => p.questions)].find(x => x.key === key);
      const on = [...card.querySelectorAll(`input[name="${key}"]:checked`)].some(i => i.value === q.other);
      other.style.display = on ? 'block' : 'none';
      if (on && e.target.value === q.other) other.focus();
    }
  });
  app.addEventListener('input', e => { const c = e.target.closest('.q'); if (c) c.classList.remove('invalid'); });
  app.addEventListener('submit', e => e.preventDefault());

  // Waarschuwing bij per ongeluk sluiten tijdens het invullen
  window.addEventListener('beforeunload', e => { if (typeof view === 'number' && view > 0) { e.preventDefault(); e.returnValue = ''; } });

  render();
})();
</script>
</body>
</html>
